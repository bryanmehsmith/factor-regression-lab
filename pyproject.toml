[project]
name = "factor-regression-lab"
version = "0.1.0"
description = "Factor regression and inference lab: is an asset's excess return alpha, or just factor exposure?"
readme = "README.md"
authors = [
    { name = "Bryan Smith", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    # Both pins below exist for one bug: this app segfaulted (SIGSEGV, not an
    # exception) the second time a session ran. Streamlit runs each session's
    # script in a new thread, so the first visitor was served and the next one
    # killed the process; a supervisor restarting it turned that into an
    # intermittent "Connection error".
    #
    # Bisecting by disabling parts of the app showed the trigger is st.dataframe,
    # which serializes through pyarrow. Disabling it gave 6/6 clean sessions
    # against 1/6 with it. Every faulthandler traceback landed inside pyarrow's
    # pandas conversion. Figures, BLAS thread counts and pandas Stylers were each
    # ruled out by experiment, so the pin is on pyarrow.
    #
    # pandas stays below 3.0 as well: 3.0 makes pyarrow-backed strings the
    # default, which widens exactly the surface that crashes here.
    "pandas>=2.2.3,<3",
    # See the note on pandas above: pyarrow 25.0.0 is where this app segfaults.
    "pyarrow>=18,<19",
    "scipy>=1.15.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.38",
    "yfinance>=1.5.1",
]

[project.scripts]
factor-regression-lab = "factor_lab:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# The distribution is "factor-regression-lab" but the import package is the
# shorter "factor_lab", so the backend needs to be told explicitly.
[tool.uv.build-backend]
module-name = "factor_lab"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises the Streamlit app end to end; deselect with -m 'not slow'",
]
